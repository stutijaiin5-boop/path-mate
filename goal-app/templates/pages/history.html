<div id="page-history" class="page">
  <div class="page-header">
    <div>
      <div class="page-title">History</div>
      <div class="page-subtitle">All your past execution plans</div>
    </div>
  </div>
  <div class="search-bar">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="historyPageSearch" type="text" placeholder="Search reports..." />
  </div>
  <div id="historyPageList" class="history-list">
    <div class="history-empty">No reports yet. Generate your first plan!</div>
  </div>
  <div id="historyPagination" class="pagination"></div>
  <div class="action-history-section">
    <h3>Recent Completed Actions</h3>
    <div id="actionHistoryList" class="action-history-list">
      <div class="history-empty" style="padding:1.5rem 0;">No completed actions yet.</div>
    </div>
  </div>
</div>
