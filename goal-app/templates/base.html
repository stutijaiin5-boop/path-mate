<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goal to Execution</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2'><polyline points='22 12 18 12 15 21 9 3 6 12 2 12'/></svg>" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-animation">
    <div class="loading-ring"></div>
    <div class="loading-ring"></div>
    <div class="loading-ring"></div>
  </div>
  <div class="loading-text">
    <span id="loadingMessage">Analyzing your execution gap...</span>
    <span class="dot">.</span>
    <span class="dot">.</span>
    <span class="dot">.</span>
  </div>
</div>

<div id="toast" class="toast"></div>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span>Goal to Execution</span>
    </div>
    <div class="nav-center">
      <button class="nav-link active" data-page="home">Home</button>
      <button class="nav-link" data-page="history">History</button>
      <button class="nav-link" data-page="analytics">Analytics</button>
      <button class="nav-link" data-page="calendar">Calendar</button>
    </div>
    <div class="nav-right">
      <button id="settingsToggle" class="nav-icon-btn" data-page="settings" title="Settings">⚙️</button>
      <button id="themeToggle" class="nav-icon-btn" title="Theme">🌙</button>
      <button id="hamburgerBtn" class="nav-icon-btn hamburger" title="Menu">☰</button>
    </div>
  </div>
</nav>

<div id="mobileDrawer" class="mobile-drawer">
  <button class="nav-link active" data-page="home">Home</button>
  <button class="nav-link" data-page="history">History</button>
  <button class="nav-link" data-page="analytics">Analytics</button>
  <button class="nav-link" data-page="calendar">Calendar</button>
  <button class="nav-link" data-page="settings">Settings</button>
</div>

<div class="app-container">
  {% block pages %}{% endblock %}
</div>

<script src="/static/particles.js"></script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/navigation.js"></script>
<script src="/static/js/generate.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/export.js"></script>
<script src="/static/js/history.js"></script>
<script src="/static/js/analytics.js"></script>
<script src="/static/js/calendar.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
